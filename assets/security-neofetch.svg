  </text>

  <!-- Bottom prompt -->
  <text x="32"
        y="273"
        font-family="monospace"
        font-size="12">
    <tspan fill="#7ee787">status</tspan>
    <tspan fill="#8b949e">: building practical security experience</tspan>
  </text>

</svg>
