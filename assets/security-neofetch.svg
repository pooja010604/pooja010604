  </text>

  <text x="155" y="240"
        font-family="monospace"
        font-size="13"
        fill="#f0f6fc">
    MITRE • NIST • OWASP
  </text>

  <!-- RIGHT -->
  <text x="530"
        y="108"
        font-family="monospace"
        font-size="14"
        font-weight="bold"
