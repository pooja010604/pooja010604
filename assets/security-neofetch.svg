  </text>

  <text x="155" y="214"
        font-family="monospace"
        font-size="13"
        fill="#f0f6fc">
    Zeek • Wireshark • Nmap
  </text>

  <text x="32" y="240"
        font-family="monospace"
        font-size="13"
        fill="#8b949e">
