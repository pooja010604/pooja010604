<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="360"
     viewBox="0 0 1000 360"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Pooja Gupta Security Operations Dashboard</title>

  <desc id="desc">
    Security operations workflow covering monitoring, threat detection,
    investigation, vulnerability assessment, network security and
    incident response.
  </desc>

  <!-- Background -->
  <rect width="1000"
        height="360"
        rx="14"
        fill="#0d1117"
        stroke="#30363d"
        stroke-width="2"/>

  <!-- Header -->
  <rect width="1000"
        height="48"
        rx="14"
        fill="#161b22"/>

  <rect y="32"
        width="1000"
        height="16"
        fill="#161b22"/>

  <circle cx="24" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="24" r="6" fill="#27c93f"/>

  <text x="92"
        y="29"
        font-family="monospace"
        font-size="15"
        fill="#8b949e">
    pooja@security-lab: ~/operations
  </text>

  <!-- Command -->
  <text x="32"
        y="80"
        font-family="monospace"
        font-size="16">

    <tspan fill="#7ee787">pooja@security-lab</tspan>
    <tspan fill="#c9d1d9">:$ security-dashboard</tspan>

  </text>

  <!-- Title -->
  <text x="32"
        y="112"
        font-family="monospace"
        font-size="20"
        font-weight="bold"
        fill="#f0f6fc">
    SECURITY OPERATIONS
  </text>

  <text x="32"
        y="135"
        font-family="monospace"
        font-size="13"
        fill="#8b949e">
    Monitor • Detect • Investigate • Assess • Respond
  </text>

  <!-- Workflow line -->
  <line x1="100"
        y1="180"
        x2="900"
        y2="180"
        stroke="#30363d"
        stroke-width="2"/>

  <!-- STEP 1 -->
  <circle cx="110"
          cy="180"
          r="30"
          fill="#161b22"
          stroke="#58a6ff"
          stroke-width="2"/>

  <text x="110"
        y="185"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="bold"
        fill="#58a6ff">
    01
  </text>

  <text x="110"
        y="225"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="bold"
        fill="#f0f6fc">
    MONITOR
  </text>

  <text x="110"
        y="246"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8b949e">
    SIEM
  </text>

  <text x="110"
        y="262"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8b949e">
    Wazuh • ELK
  </text>


  <!-- STEP 2 -->
  <circle cx="310"
          cy="180"
          r="30"
          fill="#161b22"
          stroke="#7ee787"
          stroke-width="2"/>

  <text x="310"
        y="185"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="bold"
        fill="#7ee787">
    02
  </text>

  <text x="310"
        y="225"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="bold"
        fill="#f0f6fc">
    DETECT
  </text>

  <text x="310"
        y="246"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8b949e">
    Threat Analysis
  </text>

  <text x="310"
        y="262"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8b949e">
    MITRE ATT&amp;CK
  </text>


  <!-- STEP 3 -->
  <circle cx="510"
          cy="180"
          r="30"
          fill="#161b22"
          stroke="#d2a8ff"
          stroke-width="2"/>

  <text x="510"
        y="185"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="bold"
        fill="#d2a8ff">
    03
  </text>

  <text x="510"
        y="225"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="bold"
        fill="#f0f6fc">
    INVESTIGATE
  </text>

  <text x="510"
        y="246"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8b949e">
    IR / DFIR
  </text>

  <text x="510"
        y="262"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8b949e">
    TheHive • Velociraptor
  </text>


  <!-- STEP 4 -->
  <circle cx="710"
          cy="180"
          r="30"
          fill="#161b22"
          stroke="#f0883e"
          stroke-width="2"/>

  <text x="710"
        y="185"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="bold"
        fill="#f0883e">
    04
  </text>

  <text x="710"
        y="225"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="bold"
        fill="#f0f6fc">
    ASSESS
  </text>

  <text x="710"
        y="246"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8b949e">
    VAPT / AppSec
  </text>

  <text x="710"
        y="262"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8b949e">
    Burp • Nmap • Nessus
  </text>


  <!-- STEP 5 -->
  <circle cx="890"
          cy="180"
          r="30"
          fill="#161b22"
          stroke="#ff7b72"
          stroke-width="2"/>

  <text x="890"
        y="185"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="bold"
        fill="#ff7b72">
    05
  </text>

  <text x="890"
        y="225"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        font-weight="bold"
        fill="#f0f6fc">
    RESPOND
  </text>

  <text x="890"
        y="246"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8b949e">
    Incident Response
  </text>

  <text x="890"
        y="262"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#8b949e">
    Contain • Investigate
  </text>


  <!-- Footer -->
  <line x1="32"
        y1="295"
        x2="968"
        y2="295"
        stroke="#30363d"
        stroke-width="1"/>

  <text x="32"
        y="323"
        font-family="monospace"
        font-size="12">
    <tspan fill="#7ee787">scope</tspan>
    <tspan fill="#8b949e">
      : SOC • VAPT • DFIR • Network Security
    </tspan>
  </text>

  <text x="968"
        y="323"
        text-anchor="end"
        font-family="monospace"
        font-size="12">
    <tspan fill="#7ee787">mode</tspan>
    <tspan fill="#8b949e">: hands-on</tspan>
  </text>

</svg>
